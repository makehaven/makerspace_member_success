services:
  makerspace_member_success.commands:
    class: Drupal\makerspace_member_success\Commands\MemberSuccessCommands
    arguments:
      - '@makerspace_member_success.snapshot_builder'
      - '@entity_type.manager'
      - '@makerspace_member_success.recovery_metrics'
      - '@makerspace_member_success.chargebee_followup_status_sync'
      - '@makerspace_member_success.outreach_queue_service'
      - '@makerspace_member_success.civi_backfill'
    tags:
      - { name: drush.command }

  makerspace_member_success.scenario_commands:
    class: Drupal\makerspace_member_success\Commands\ScenarioCommands
    arguments:
      - '@makerspace_member_success.scenario_simulator'
      - '@database'
      - '@entity_type.manager'
    tags:
      - { name: drush.command }
