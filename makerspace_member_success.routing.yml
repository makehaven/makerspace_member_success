makerspace_member_success.settings:
  path: '/admin/config/makerspace/member-success'
  defaults:
    _form: '\Drupal\makerspace_member_success\Form\MemberSuccessSettingsForm'
    _title: 'Member Success Settings'
  requirements:
    _permission: 'administer makerspace member success'

makerspace_member_success.dashboard:
  path: '/admin/makerspace/member-success/dashboard'
  defaults:
    _controller: '\Drupal\makerspace_member_success\Controller\MemberSuccessDashboardController::build'
    _title: 'Member Success Dashboard'
  requirements:
    _permission: 'access makerspace member success queues'

makerspace_member_success.log_contact:
  path: '/admin/makerspace/member-success/log-contact/{user}'
  defaults:
    _form: '\Drupal\makerspace_member_success\Form\LogContactForm'
    _title: 'Log Member Interaction'
  requirements:
    _permission: 'log makerspace member success contacts'
  options:
    parameters:
      user:
        type: entity:user

makerspace_member_success.mark_no_action_needed:
  path: '/admin/makerspace/member-success/no-action-needed/{user}/{stage}'
  defaults:
    _form: '\Drupal\makerspace_member_success\Form\MarkNoActionNeededForm'
    _title: 'Mark No Action Needed'
  requirements:
    _permission: 'log makerspace member success contacts'
    stage: 'onboarding|engagement|retention|recovery|paused'
  options:
    parameters:
      user:
        type: entity:user

makerspace_member_success.queue_review:
  path: '/admin/makerspace/member-success/queue-review'
  defaults:
    _form: '\Drupal\makerspace_member_success\Form\OutreachQueueReviewForm'
    _title: 'Outreach Queue Review'
  requirements:
    _permission: 'administer makerspace member success'

makerspace_member_success.intervention_performance:
  path: '/admin/makerspace/member-success/intervention-performance'
  defaults:
    _controller: '\Drupal\makerspace_member_success\Controller\MemberSuccessDashboardController::contractorPerformance'
    _title: 'Intervention Performance'
  requirements:
    _permission: 'access makerspace member success queues'

# Legacy redirect - old URL
makerspace_member_success.contractor_performance:
  path: '/admin/makerspace/member-success/contractor-performance'
  defaults:
    _controller: '\Drupal\makerspace_member_success\Controller\MemberSuccessDashboardController::contractorPerformance'
    _title: 'Intervention Performance'
  requirements:
    _permission: 'access makerspace member success queues'

makerspace_member_success.export_staff_performance:
  path: '/admin/makerspace/member-success/export/staff-performance'
  defaults:
    _controller: '\Drupal\makerspace_member_success\Controller\MemberSuccessDashboardController::exportStaffPerformance'
  requirements:
    _permission: 'administer makerspace member success'

makerspace_member_success.export_channel_effectiveness:
  path: '/admin/makerspace/member-success/export/channel-effectiveness'
  defaults:
    _controller: '\Drupal\makerspace_member_success\Controller\MemberSuccessDashboardController::exportChannelEffectiveness'
  requirements:
    _permission: 'administer makerspace member success'

makerspace_member_success.export_monthly_trends:
  path: '/admin/makerspace/member-success/export/monthly-trends'
  defaults:
    _controller: '\Drupal\makerspace_member_success\Controller\MemberSuccessDashboardController::exportMonthlyTrends'
  requirements:
    _permission: 'administer makerspace member success'

makerspace_member_success.export_all:
  path: '/admin/makerspace/member-success/export/all'
  defaults:
    _controller: '\Drupal\makerspace_member_success\Controller\MemberSuccessDashboardController::exportAll'
  requirements:
    _permission: 'administer makerspace member success'
