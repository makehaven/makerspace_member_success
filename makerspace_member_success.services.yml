services:
  makerspace_member_success.snapshot_builder:
    class: Drupal\makerspace_member_success\Service\MemberSuccessSnapshotBuilder
    arguments:
      - '@database'
      - '@config.factory'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@logger.factory'
      - '@civicrm'

  makerspace_member_success.civicrm_helper:
    class: Drupal\makerspace_member_success\Service\CiviCrmHelper
    arguments:
      - '@civicrm'
      - '@logger.factory'

  makerspace_member_success.activity_logger:
    class: Drupal\makerspace_member_success\Service\CiviCrmActivityLogger
    arguments:
      - '@config.factory'
      - '@logger.factory'
      - '@current_user'
      - '@civicrm'

  makerspace_member_success.civi_followup_group_sync:
    class: Drupal\makerspace_member_success\Service\CiviFollowupGroupSync
    arguments:
      - '@civicrm'
      - '@config.factory'
      - '@logger.factory'

  makerspace_member_success.chargebee_followup_status_sync:
    class: Drupal\makerspace_member_success\Service\ChargebeeFollowupStatusSync
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@logger.factory'

  makerspace_member_success.followup_status_manager:
    class: Drupal\makerspace_member_success\Service\FollowupStatusManager
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@makerspace_member_success.civi_followup_group_sync'
      - '@makerspace_member_success.chargebee_followup_status_sync'
      - '@makerspace_member_success.review_notification'
      - '@cache_tags.invalidator'
      - '@datetime.time'
      - '@logger.channel.makerspace_member_success'

  makerspace_member_success.review_notification:
    class: Drupal\makerspace_member_success\Service\NeedsReviewNotificationService
    arguments:
      - '@config.factory'
      - '@plugin.manager.mail'
      - '@current_user'
      - '@language_manager'
      - '@logger.factory'

  makerspace_member_success.outreach_service:
    class: Drupal\makerspace_member_success\Service\OutreachService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@current_user'
      - '@logger.factory'
      - '@makerspace_member_success.activity_logger'
      - '@makerspace_member_success.civi_followup_group_sync'
      - '@makerspace_member_success.chargebee_followup_status_sync'

  makerspace_member_success.recovery_metrics:
    class: Drupal\makerspace_member_success\Service\RecoveryMetrics
    arguments:
      - '@database'

  makerspace_member_success.queue_query_applier:
    class: Drupal\makerspace_member_success\Service\MemberSuccessQueueQueryApplier
    arguments:
      - '@request_stack'

  makerspace_member_success.bucket_counter:
    class: Drupal\makerspace_member_success\Service\MemberSuccessBucketCounter
    arguments:
      - '@database'

  makerspace_member_success.outreach_suppression_checker:
    class: Drupal\makerspace_member_success\Service\OutreachSuppressionChecker
    arguments:
      - '@database'

  makerspace_member_success.outreach_policy_decider:
    class: Drupal\makerspace_member_success\Service\OutreachPolicyDecider
    arguments:
      - '@config.factory'
      - '@makerspace_member_success.outreach_suppression_checker'

  makerspace_member_success.outreach_queue_service:
    class: Drupal\makerspace_member_success\Service\OutreachQueueService
    arguments:
      - '@database'
      - '@datetime.time'
      - '@makerspace_member_success.outreach_policy_decider'
      - '@config.factory'
      - '@makerspace_member_success.outreach_message_builder'
      - '@makerspace_member_success.outreach_sender'
      - '@entity_type.manager'
      - '@makerspace_member_success.outreach_service'
      - '@makerspace_member_success.outreach_suppression_checker'

  makerspace_member_success.outreach_message_builder:
    class: Drupal\makerspace_member_success\Service\OutreachMessageBuilder
    arguments:
      - '@database'
      - '@config.factory'
      - '@entity_type.manager'
      - '@request_stack'

  makerspace_member_success.outreach_sender:
    class: Drupal\makerspace_member_success\Service\OutreachSender
    arguments:
      - '@plugin.manager.mail'
      - '@language_manager'

  logger.channel.makerspace_member_success:
    parent: logger.channel_base
    arguments: ['makerspace_member_success']

  Drupal\makerspace_member_success\Service\OutreachSuppressionCheckerInterface:
    alias: makerspace_member_success.outreach_suppression_checker

  Drupal\makerspace_member_success\Service\OutreachPolicyDeciderInterface:
    alias: makerspace_member_success.outreach_policy_decider

  Drupal\makerspace_member_success\Service\OutreachQueueServiceInterface:
    alias: makerspace_member_success.outreach_queue_service

  Drupal\makerspace_member_success\Service\OutreachMessageBuilderInterface:
    alias: makerspace_member_success.outreach_message_builder

  Drupal\makerspace_member_success\Service\OutreachSenderInterface:
    alias: makerspace_member_success.outreach_sender

  makerspace_member_success.civi_backfill:
    class: Drupal\makerspace_member_success\Service\CiviCrmActivityBackfillService
    arguments:
      - '@database'
      - '@civicrm'
      - '@entity_type.manager'
      - '@logger.factory'

  makerspace_member_success.scenario_simulator:
    class: Drupal\makerspace_member_success\Service\MemberSuccessScenarioSimulator
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@datetime.time'
      - '@makerspace_member_success.outreach_queue_service'
      - '@config.factory'
