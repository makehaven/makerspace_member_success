services:
  makerspace_member_success.snapshot_builder:
    class: Drupal\makerspace_member_success\Service\MemberSuccessSnapshotBuilder
    arguments:
      - '@database'
      - '@config.factory'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@logger.factory'
      - '@civicrm'

  makerspace_member_success.civicrm_helper:
    class: Drupal\makerspace_member_success\Service\CiviCrmHelper
    arguments:
      - '@civicrm'
      - '@logger.factory'

  makerspace_member_success.activity_logger:
    class: Drupal\makerspace_member_success\Service\CiviCrmActivityLogger
    arguments:
      - '@config.factory'
      - '@logger.factory'
      - '@current_user'
      - '@civicrm'

  makerspace_member_success.outreach_service:
    class: Drupal\makerspace_member_success\Service\OutreachService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@current_user'
      - '@logger.factory'
      - '@makerspace_member_success.activity_logger'

  makerspace_member_success.recovery_metrics:
    class: Drupal\makerspace_member_success\Service\RecoveryMetrics
    arguments:
      - '@database'

  makerspace_member_success.queue_query_applier:
    class: Drupal\makerspace_member_success\Service\MemberSuccessQueueQueryApplier
    arguments:
      - '@request_stack'

  makerspace_member_success.commands:
    class: Drupal\makerspace_member_success\Commands\MemberSuccessCommands
    arguments:
      - '@makerspace_member_success.snapshot_builder'
      - '@entity_type.manager'
      - '@makerspace_member_success.recovery_metrics'
    tags:
      - { name: drush.command }
