# Dormancy: no door visit for this long, in any stage except paused/recovery.
# The clock is the shorter of days-since-last-visit and days-since-joining, so a
# brand-new member is never dormant. Tiers replace each other (high wins), and
# in retention the dormancy points replace the smaller inactivity tier.
dormancy_enabled: true
dormancy_watch_days: 45
dormancy_watch_points: 20
dormancy_high_days: 90
dormancy_high_points: 35
# Settled: past this many days without a visit the member is LEFT ALONE —
# risk 0, out of every call queue (calling long-absent members mostly prompted
# cancellations, JR 2026-10-14). They get the re-engagement offer below
# instead. 0 = never settle.
dormancy_settled_days: 120
outreach_send_hour_local: 10
