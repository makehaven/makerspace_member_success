template_onboarding: |
  Subject: One step left at MakeHaven — {next_step}

  Hi {contact.first_name},

  You're almost a MakeHaven member — there's just one thing left before you can start making:

  Next step — {next_step}:
  {next_step_url}

  Once that's done, the rest is quick. Here's the whole path from signup to your key card:
  1. Complete your member profile
  2. Watch the safety orientation video
  3. Pass the safety quiz (look for the red button at the bottom of the video)
  4. Book your in-person orientation — a 15-minute walkthrough where you pick up your key card. Staff are friendly, no pressure!

  Stuck, or have a question? Just reply to this email and we'll help you get unstuck.

  Looking forward to seeing you at the space!

  — The MakeHaven Team
template_engagement: |
  Subject: Let's get started & Make Something!

  Hi {contact.first_name},

  I noticed you've started your adventure at MakeHaven and have your access card, but you haven't had a chance to get badged for any areas yet. We really want to make sure you are getting the most out of your membership!

  Is there anything holding you back? If you're not sure where to start, I recommend:
  1. Choosing a tool or area you're interested in (woodshop, 3D printing, textiles, etc.).
  2. Watching the training video and taking the quiz on our website.
  3. Scheduling a badging appointment with one of our facilitators here: {domain.base_url}/facilitator/schedules

  The facilitator will show you the ropes and make sure you're safe and comfortable using the equipment.

  If you need any assistance or have questions about how to get started, please let me know.

  Happy Making!

  Christina Quinonez
  (203) 401-8815
  christina.quinonez@makehaven.org
template_retention: |
  Subject: We miss you at MakeHaven!

  Hi {contact.first_name},

  I noticed it's been a while since we've seen you at MakeHaven, and I wanted to check in. Your membership is active and ready whenever you are — sometimes life just gets busy!

  If something is keeping you away, I'd love to help:
  1. Not sure what to work on next? Reply and tell me what you'd like to make, and I'll point you at the right tools and trainings.
  2. Want a refresher or a new badge? See the facilitator schedules: {domain.base_url}/facilitator/schedules
  3. Or just come to a meetup — upcoming events: {domain.base_url}/events

  If your needs have changed, I'm happy to talk through options too. We'd love to see you back in the space!

  Happy Making!

  Christina Quinonez
  (203) 401-8815
  christina.quinonez@makehaven.org
template_recovery: |
  Subject: Monthly Membership Fee Not Processed

  Hi {contact.first_name},

  I wanted to reach out regarding your monthly membership fee. We've been attempting to process it, but it seems the card on file wasn't successful. 

  To avoid any interruption to your membership or access, please update your payment information or retry the payment here: {domain.base_url}/pay (Note: You'll need to be logged in to access your account).

  If you're having any technical trouble with the site or need to discuss your account, please don't hesitate to reach out. We're here to help!

  We love having you as part of the MakeHaven community and look forward to seeing what you create next.

  Best,

  Christina Quinonez
  (203) 401-8815
  christina.quinonez@makehaven.org
