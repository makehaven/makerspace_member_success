# --- Badge nudge -------------------------------------------------------------
# Members who passed a badge quiz but never completed the in-person checkout.
# Ships DARK: nothing sends until badge_nudge_enabled is switched on, and even
# then stage_badge_require_manual_approval keeps a human between the queue and
# the send until the copy has been proven on a small batch.
badge_nudge_enabled: false
# Do not chase someone who passed the quiz this week — they may simply not have
# been in yet. 14 days is roughly a fortnight of missed opportunities.
badge_nudge_min_age_days: 14
# Upper bound, and the reason it exists: the accumulated backlog is HELD.
# 531 current members have a badge waiting more than 90 days (175 between three
# months and a year, 356 beyond that). Mailing them is a separate decision
# about a different audience — an old badge is as likely to mean "changed my
# mind" as "still waiting" — and it would also be the single largest send this
# subject has ever had. Without this bound, switching the nudge on would reach
# all of them on the first cron run. Raising or zeroing it is the deliberate
# act that releases the backlog; see docs/proposals/BADGE_NUDGE_PLAN.md.
badge_nudge_max_age_days: 90
# One email per member listing their badges, never one per badge: 60 members
# hold eight or more, and a mail each would be indefensible.
badge_nudge_max_badges_listed: 6
# Deliberately slower and more limited than the onboarding nudge. This is a
# reminder about something optional, not a stalled signup.
stage_badge_cooldown_days: 45
stage_badge_max_attempts: 2
stage_badge_min_risk_to_contact: 0
stage_badge_require_manual_approval: true
template_badge: |
  Subject: You have {badge.count} {badge.plural} waiting on a short checkout

  Hi {contact.first_name},

  You passed the quiz for {badge.count} {badge.plural}, and you are one step
  from being able to use the tools: a short in-person checkout with a
  facilitator. Until that happens the tools stay locked, which is a shame when
  you have already done the hard part.

  Waiting on a checkout:
  {badge.list}

  A checkout is usually only a few minutes. You can see who is in the building
  and when, and book a slot in their shift, here:
  {badge.schedules_url}

  Or see everything you have waiting in one place:
  {badge.complete_url}

  If a tool on that list is not something you want any more, just ignore this —
  nothing expires and there is nothing to cancel.

  Questions? Reply to this email and a person will read it.

  The MakeHaven Team

# --- Re-engagement offer -----------------------------------------------------
# For settled-dormant members (dormancy_settled_days). Ships DARK. When on, one
# small batch per week is queued for staff approval — most recently settled
# first — and nobody is offered twice inside the cooldown. Never a full send.
reengage_enabled: false
reengage_batch_size: 10
# The offer itself, dropped into the email as {reengage.offer}. A real,
# specific reason to come back beats a "we miss you".
reengage_offer: 'a free one-on-one session with a staff member: pick a project, get a refresher on the tools you need for it, and book the time that suits you'
stage_reengage_cooldown_days: 180
stage_reengage_max_attempts: 0
stage_reengage_min_risk_to_contact: 0
stage_reengage_require_manual_approval: true
template_reengage: |
  Subject: An offer to get you back to making, {contact.first_name}

  Hi {contact.first_name},

  We have not seen you at MakeHaven for a while, and that is fine — life gets
  busy. You are still a member, and we would like to make it easy to pick up
  where you left off.

  So here is an offer: {reengage.offer}.

  If you would like it, just reply to this email and a person will set it up.

  If now is not the time, no need to reply. We will not keep asking.

  The MakeHaven Team

# Queued outreach rows untouched for this many days are cancelled
# (expired_stale) by cron, so a forgotten batch cannot be bulk-approved months
# later. Cron-fed stages refresh their rows every run. 0 = never expire.
queue_stale_days: 30

# Silent holdout. holdout_percent of eligible members in each holdout_stages
# campaign are logged as held out (queue status held_out) instead of being
# offered, chosen by a stable hash of stage and uid. drush ms:holdout-report
# compares the arms once holdout_window_days have passed. 0 = no holdout.
holdout_percent: 25
holdout_stages:
  - pause_end
  - reengage
holdout_window_days: 60

# Pause reason. Ships DARK. When on, a member whose pause began in the last
# pause_reason_window_days gets one email asking why (seven answers, one link
# each); the answer page saves nothing until they press Send, because mail
# scanners follow every link. Sends without staff approval: it is a question,
# not an offer. Answers: ms_pause_reason, shown in the paused queue.
pause_reason_enabled: false
pause_reason_window_days: 7
stage_pause_reason_cooldown_days: 0
stage_pause_reason_max_attempts: 0
stage_pause_reason_min_risk_to_contact: 0
template_pause_reason: |
  Subject: A quick question about your pause

  Hi {contact.first_name},

  Your MakeHaven membership is now paused{pause.until}.

  One quick question so we can plan: what is the main reason for the pause?
  Pick the one that fits, then press Send on the page that opens.

  {pause_reason.links}

  If you would rather tell us in your own words, just reply to this email.

  The MakeHaven Team

# --- Dunning triage + pause end ----------------------------------------------
# "Cold" = no door visit in this many days. A payment-failed member who is cold
# is labelled payment_failed_cold in the recovery queue (a different
# conversation, not a card-fix call); a pauser cold before the pause began is
# labelled pause_cold. Label only — no risk points.
cold_days: 90
# Pause-end outreach. Ships DARK. When on, paused members whose Chargebee
# resume date falls within pause_end_lead_days are queued for staff approval,
# once per pause. Cold pausers with under pause_gems_tenure_days of membership
# get the GEMS-offer version of the email.
pause_end_enabled: false
pause_end_lead_days: 14
pause_gems_tenure_days: 365
# Dropped into the GEMS version as {pause_end.gems_offer}. Confirm the price
# with the education lead before switching pause_end_enabled on.
pause_end_gems_offer: 'a seat in an upcoming GEMS cohort at half price. GEMS is our small-group program that takes you through the core shop tools over a few weeks, and most people come out of it with a stack of new badges'
stage_pause_end_cooldown_days: 30
stage_pause_end_max_attempts: 0
stage_pause_end_min_risk_to_contact: 0
stage_pause_end_require_manual_approval: true
template_pause_end: |
  Subject: Your MakeHaven pause ends {pause.resume_date}

  Hi {contact.first_name},

  A quick note that your membership pause ends on {pause.resume_date}. Your
  membership, and its billing, pick back up automatically that day.

  If you need more time, or something has changed, just reply to this email
  and a person will help you sort it out.

  We look forward to seeing you back in the shop.

  The MakeHaven Team
template_pause_end__pause_gems_fit: |
  Subject: Your MakeHaven pause ends {pause.resume_date}, and an offer

  Hi {contact.first_name},

  A quick note that your membership pause ends on {pause.resume_date}. Your
  membership picks back up automatically that day.

  To make coming back easier, we would like to offer you {pause_end.gems_offer}.
  You can see the upcoming cohorts here: {gems.url}

  If you would like a seat, just reply to this email and a person will set it
  up. If you need more time on your pause, reply and we will help with that
  too.

  The MakeHaven Team
