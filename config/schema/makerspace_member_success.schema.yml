makerspace_member_success.settings:
  type: config_object
  label: 'Makerspace Member Success settings'
  mapping:
    door_badge_tid:
      type: integer
      label: 'Door badge term ID'
    badge_one_days:
      type: integer
      label: 'Days to earn first additional badge'
    badge_four_days:
      type: integer
      label: 'Days to earn four badges'
    new_member_days:
      type: integer
      label: 'Days considered a new member'
    retention_recency_days:
      type: sequence
      label: 'Retention recency windows (days)'
      sequence:
        type: integer
    payment_risk_fields:
      type: sequence
      label: 'Payment risk field machine names'
      sequence:
        type: string
    civicrm_preferred_method_field:
      type: string
      label: 'CiviCRM preferred communication method field'
    civicrm_member_followup_field:
      type: string
      label: 'CiviCRM cancellation followup field'
    civicrm_do_not_fields:
      type: sequence
      label: 'CiviCRM do-not contact fields'
      sequence:
        type: string
    outreach_activity_types:
      type: sequence
      label: 'CiviCRM activity types for outreach'
      sequence:
        type: string
    template_onboarding:
      type: string
      label: 'CiviCRM template for onboarding stage'
    template_engagement:
      type: string
      label: 'CiviCRM template for engagement stage'
    template_retention:
      type: string
      label: 'CiviCRM template for retention stage'
    template_recovery:
      type: string
      label: 'CiviCRM template for recovery stage'
    civicrm_activity_type_phone:
      type: integer
      label: 'CiviCRM activity type for phone outreach'
    civicrm_activity_type_email:
      type: integer
      label: 'CiviCRM activity type for email outreach'
    civicrm_activity_type_in_person:
      type: integer
      label: 'CiviCRM activity type for in-person outreach'
    civicrm_activity_type_other:
      type: integer
      label: 'CiviCRM activity type for other outreach'
