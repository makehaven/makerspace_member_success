makerspace_member_success.settings:
  type: config_object
  label: 'Makerspace Member Success settings'
  mapping:
    door_badge_tid:
      type: integer
      label: 'Door badge term ID'
    badge_one_days:
      type: integer
      label: 'Days without activity before engagement becomes actionable'
    badge_watch_days:
      type: integer
      label: 'Days without activity before engagement enters watch tier'
    badge_four_days:
      type: integer
      label: 'Days to earn four badges'
    new_member_days:
      type: integer
      label: 'Days considered a new member'
    onboarding_stall_hours:
      type: integer
      label: 'Hours on one onboarding step before flagging'
    orientation_quiz_nid:
      type: integer
      label: 'Safety quiz node ID'
    lead_followup_enabled:
      type: boolean
      label: 'Auto-email unpaid leads'
    lead_followup_hours:
      type: integer
      label: 'Hours to wait before unpaid-lead follow-up'
    lead_followup_max_per_run:
      type: integer
      label: 'Max unpaid-lead follow-up emails per cron run'
    lead_join_webform_id:
      type: string
      label: 'Join webform machine name'
    lead_resume_url:
      type: string
      label: 'Unpaid-lead resume link'
    lead_site_base_url:
      type: string
      label: 'Site base URL for unpaid-lead email links'
    retention_recency_days:
      type: sequence
      label: 'Retention recency windows (days)'
      sequence:
        type: integer
    outreach_send_hour_local:
      type: integer
      label: 'Default outreach send hour (local time, 0-23)'
    payment_risk_fields:
      type: sequence
      label: 'Payment risk field machine names'
      sequence:
        type: string
    civicrm_preferred_method_field:
      type: string
      label: 'CiviCRM preferred communication method field'
    civicrm_member_followup_field:
      type: string
      label: 'CiviCRM cancellation followup field'
    civicrm_group_outreach_active:
      type: integer
      label: 'CiviCRM group ID for outreach_active'
    civicrm_group_outreach_exhausted:
      type: integer
      label: 'CiviCRM group ID for outreach_exhausted'
    civicrm_group_no_action_needed:
      type: integer
      label: 'CiviCRM group ID for no_action_needed'
    civicrm_group_return_intent:
      type: integer
      label: 'CiviCRM group ID for return_intent'
    civicrm_group_confirmed_cancellation:
      type: integer
      label: 'CiviCRM group ID for confirmed_cancellation'
    needs_review_notification_enabled:
      type: boolean
      label: 'Whether needs-review notifications are enabled'
    needs_review_notification_emails:
      type: sequence
      label: 'Email recipients for needs-review notifications'
      sequence:
        type: string
    chargebee_followup_push_enabled:
      type: boolean
      label: 'Whether followup status should be pushed to Chargebee'
    chargebee_followup_push_field_param:
      type: string
      label: 'Chargebee custom field parameter for followup status'
    chargebee_followup_reconcile_on_cron:
      type: boolean
      label: 'Whether to reconcile followup statuses to Chargebee during cron'
    chargebee_followup_reconcile_limit:
      type: integer
      label: 'Max users to process per cron reconciliation pass'
    chargebee_followup_reconcile_dry_run:
      type: boolean
      label: 'Whether cron reconciliation should run in dry-run mode'
    chargebee_followup_reconcile_force:
      type: boolean
      label: 'Whether cron reconciliation bypasses push-disabled config'
    civicrm_backfill_on_cron:
      type: boolean
      label: 'Whether cron imports recent CiviCRM email/phone activities into the outreach log'
    civicrm_backfill_days:
      type: integer
      label: 'How many days back the cron CiviCRM activity backfill scans'
    civicrm_do_not_fields:
      type: sequence
      label: 'CiviCRM do-not contact fields'
      sequence:
        type: string
    outreach_activity_types:
      type: sequence
      label: 'CiviCRM activity types for outreach'
      sequence:
        type: string
    template_onboarding:
      type: string
      label: 'CiviCRM template for onboarding stage'
    template_engagement:
      type: string
      label: 'CiviCRM template for engagement stage'
    template_retention:
      type: string
      label: 'CiviCRM template for retention stage'
    template_recovery:
      type: string
      label: 'CiviCRM template for recovery stage'
    template_paused:
      type: string
      label: 'Paused stage default email template ID'
    sms_template_onboarding:
      type: string
      label: 'CiviCRM SMS template for onboarding stage'
    sms_template_engagement:
      type: string
      label: 'CiviCRM SMS template for engagement stage'
    sms_template_retention:
      type: string
      label: 'CiviCRM SMS template for retention stage'
    sms_template_recovery:
      type: string
      label: 'CiviCRM SMS template for recovery stage'
    sms_template_paused:
      type: string
      label: 'Paused stage default SMS template ID'
    email_template_overrides:
      type: sequence
      label: 'Email template override rules (stage.reason=template_id)'
      sequence:
        type: string
    sms_template_overrides:
      type: sequence
      label: 'SMS template override rules (stage.reason=template_id)'
      sequence:
        type: string
    automation_enabled:
      type: boolean
      label: 'Whether automated outreach sending is enabled'
    onboarding_auto_nudge_enabled:
      type: boolean
      label: 'Automatically email onboarding members stalled at a join-funnel step'
    onboarding_auto_nudge_steps:
      type: sequence
      label: 'Funnel steps the auto-nudge targets (empty = every onboarding-stalled member)'
      sequence:
        type: string
        label: 'Funnel step machine name'
    automation_policy_version:
      type: string
      label: 'Automation policy version identifier'
    pause_all:
      type: boolean
      label: 'Pause all outreach automation'
    pause_email:
      type: boolean
      label: 'Pause email outreach automation'
    pause_sms:
      type: boolean
      label: 'Pause SMS outreach automation'
    stage_onboarding_min_risk_to_contact:
      type: integer
      label: 'Onboarding minimum risk score to contact'
    stage_onboarding_cooldown_days:
      type: integer
      label: 'Onboarding cooldown days'
    stage_onboarding_max_attempts:
      type: integer
      label: 'Onboarding max attempts before manual'
    stage_onboarding_require_manual_approval:
      type: boolean
      label: 'Onboarding requires manual approval'
    stage_engagement_min_risk_to_contact:
      type: integer
      label: 'Engagement minimum risk score to contact'
    stage_engagement_cooldown_days:
      type: integer
      label: 'Engagement cooldown days'
    stage_engagement_max_attempts:
      type: integer
      label: 'Engagement max attempts before manual'
    stage_engagement_require_manual_approval:
      type: boolean
      label: 'Engagement requires manual approval'
    stage_retention_min_risk_to_contact:
      type: integer
      label: 'Retention minimum risk score to contact'
    stage_retention_cooldown_days:
      type: integer
      label: 'Retention cooldown days'
    stage_retention_max_attempts:
      type: integer
      label: 'Retention max attempts before manual'
    stage_retention_require_manual_approval:
      type: boolean
      label: 'Retention requires manual approval'
    stage_recovery_min_risk_to_contact:
      type: integer
      label: 'Recovery minimum risk score to contact'
    stage_recovery_cooldown_days:
      type: integer
      label: 'Recovery cooldown days'
    stage_recovery_max_attempts:
      type: integer
      label: 'Recovery max attempts before manual'
    stage_recovery_require_manual_approval:
      type: boolean
      label: 'Recovery requires manual approval'
    paused_min_risk_to_contact:
      type: integer
      label: 'Paused stage: minimum risk score to trigger outreach'
    paused_cooldown_days:
      type: integer
      label: 'Paused stage: days between outreach attempts'
    paused_max_attempts:
      type: integer
      label: 'Paused stage: maximum outreach attempts'
    civicrm_activity_type_phone:
      type: integer
      label: 'CiviCRM activity type for phone outreach'
    civicrm_activity_type_email:
      type: integer
      label: 'CiviCRM activity type for email outreach'
    civicrm_activity_type_in_person:
      type: integer
      label: 'CiviCRM activity type for in-person outreach'
    civicrm_activity_type_other:
      type: integer
      label: 'CiviCRM activity type for other outreach'
